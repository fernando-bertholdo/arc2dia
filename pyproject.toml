[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "arc2dia"
dynamic = ["version"]
description = "Move an Arc browser sidebar to Dia without losing open tabs or nested folders"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []
license = { text = "MIT" }
authors = [{ name = "Fernando Bertholdo" }]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: MacOS",
    "Environment :: Console",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
]

[project.scripts]
arc2dia = "arc2dia.cli:main"

[tool.setuptools]
packages = ["arc2dia"]

[tool.setuptools.dynamic]
version = { attr = "arc2dia.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
